    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Store</title>
<style>
:root{
  --bg:#eef1f5;--surface:#fff;--ink:#14181f;--muted:#5b6575;--line:#d9dee6;--accent:#2b50e6;--on-accent:#fff;--shadow:rgba(20,24,31,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1116;--surface:#181c24;--ink:#f1f3f7;--muted:#9aa4b5;--line:#2a303b;--accent:#6f8bff;--on-accent:#0e1116;--shadow:rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{--bg:#0e1116;--surface:#181c24;--ink:#f1f3f7;--muted:#9aa4b5;--line:#2a303b;--accent:#6f8bff;--on-accent:#0e1116;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em}
nav{display:flex;gap:6px;align-items:center}
nav a{padding:8px 12px;border-radius:999px;font-size:15px;color:var(--muted)}
nav a:hover{color:var(--ink)}
.bag{background:var(--ink);color:var(--bg)!important;font-weight:600}
@media (max-width:560px){nav a.hide{display:none}}

/* Hero */
.hero{max-width:1040px;margin:0 auto;padding:40px 20px 56px;display:grid;gap:36px;align-items:center}
.hero h1{font-size:clamp(40px,9vw,76px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px;font-weight:800}
.hero p{font-size:18px;color:var(--muted);max-width:34ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
@media (min-width:820px){.hero{grid-template-columns:1.1fr .9fr;padding-top:72px}}

/* Phone drawing */
.phone{--c1:#3b4a9e;--c2:#9cb0ff;position:relative;width:var(--w,220px);aspect-ratio:9/19;border-radius:15% / 7%;padding:3%;background:linear-gradient(145deg,var(--c2),var(--c1));box-shadow:0 30px 60px -20px var(--shadow),inset 0 0 0 2px rgba(255,255,255,.25);transition:background .3s}
.screen{height:100%;border-radius:12% / 5.5%;background:radial-gradient(120% 70% at 30% 20%,#ffd27a 0,#ff6f61 38%,#5b3df5 75%,#16124a 100%);position:relative;overflow:hidden}
.screen::before{content:"";position:absolute;top:2.5%;left:50%;transform:translateX(-50%);width:30%;height:3.6%;background:#000;border-radius:999px}
.screen b{position:absolute;left:0;right:0;bottom:14%;text-align:center;color:#fff;font-size:calc(var(--w,220px)*.28);font-weight:200;letter-spacing:-.04em;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.hero .phone{--w:min(62vw,250px);margin:0 auto;transform:rotate(-6deg)}

/* Products */
main section{max-width:1040px;margin:0 auto;padding:0 20px 64px}
h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.card .phone{--w:120px;margin:8px 0 22px}
.card h3{margin:0;font-size:20px;letter-spacing:-.02em}
.card p{margin:6px 0 14px;color:var(--muted);font-size:15px;min-height:46px}
.price{font-weight:700;margin-bottom:14px}
.sw{display:flex;gap:10px;margin-bottom:18px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.card .btn{width:100%;justify-content:center;background:var(--ink);color:var(--bg);min-height:46px;border:0;cursor:pointer;font-family:inherit}
.card .btn.added{background:var(--accent);color:var(--on-accent)}

/* Footer */
footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#top">iPhone Store</a>
    <nav aria-label="Main">
      <a class="hide" href="#models">Models</a>
      <a class="hide" href="#models">Compare</a>
      <a class="bag" href="#models" id="bag">Bag (0)</a>
    </nav>
  </div>
</header>

<div id="top" class="hero">
  <div>
    <h1>Pro camera.<br>All-day battery.</h1>
    <p>Pick the iPhone that fits how you shoot, scroll and work.</p>
    <div class="cta">
      <a class="btn primary" href="#models">Shop iPhone</a>
      <a class="btn ghost" href="#models">Compare models</a>
    </div>
  </div>
  <div class="phone" aria-hidden="true"><div class="screen"><b>9:41</b></div></div>
</div>

<main>
<section id="models">
  <h2>Choose your iPhone</h2>
  <p class="sub">Four models. Tap a color to preview it.</p>
  <div class="grid" id="grid"></div>
</section>
</main>

<footer>Sample page with placeholder prices. Not an official store.</footer>

<script>
const models=[
 {n:"iPhone Pro",d:"Triple camera and the brightest display.",p:"From $999",c:[["Deep Blue","#26346e","#7d92e8"],["Silver","#9aa1ad","#eef0f4"],["Orange","#c4571f","#ffb27a"]]},
 {n:"iPhone Air",d:"Thin and light, made for one-hand use.",p:"From $899",c:[["Sky","#5f8fc4","#d3e7fb"],["Cloud","#b9bdc6","#f6f7fa"],["Black","#1b1e26","#4b5160"]]},
 {n:"iPhone",d:"Fast, bright and great for everyday photos.",p:"From $799",c:[["Lavender","#8a74c9","#e0d6fb"],["Sage","#6b8f7a","#cfe6d8"],["White","#cfd3da","#ffffff"]]},
 {n:"iPhone e",d:"The essentials at the lowest price.",p:"From $599",c:[["Black","#1b1e26","#4b5160"],["White","#cfd3da","#ffffff"]]}
];
const grid=document.getElementById('grid');let bag=0;
models.forEach(m=>{
  const el=document.createElement('article');el.className='card';
  const [,a0,b0]=m.c[0];
  el.innerHTML=`<div class="phone" style="--c1:${a0};--c2:${b0}" aria-hidden="true"><div class="screen"></div></div>
  <h3>${m.n}</h3><p>${m.d}</p><div class="price">${m.p}</div>
  <div class="sw" role="group" aria-label="${m.n} color"></div>
  <button class="btn" type="button">Add to bag</button>`;
  const phone=el.querySelector('.phone'),sw=el.querySelector('.sw'),btn=el.querySelector('.btn');
  m.c.forEach(([name,a,b],i)=>{
    const s=document.createElement('button');s.type='button';
    s.setAttribute('aria-label',name);s.setAttribute('aria-pressed',i===0);
    s.style.background=`linear-gradient(145deg,${b},${a})`;
    s.onclick=()=>{
      phone.style.setProperty('--c1',a);phone.style.setProperty('--c2',b);
      sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
      s.setAttribute('aria-pressed','true');
    };
    sw.appendChild(s);
  });
  btn.onclick=()=>{
    bag++;document.getElementById('bag').textContent=`Bag (${bag})`;
    btn.textContent='Added';btn.classList.add('added');
    setTimeout(()=>{btn.textContent='Add to bag';btn.classList.remove('added')},1400);
  };
  grid.appendChild(el);
});
</script>
</body>
</html>
</body>
</html>
